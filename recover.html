<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repair — Mauritius Mass Finder</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:20px;color:#241914}
  h1{color:#6f2c2c}
  .btn{display:inline-block;padding:12px 24px;background:#6f2c2c;color:#fff;border:none;border-radius:12px;font-size:1rem;cursor:pointer;margin-top:16px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  #status{margin-top:16px;padding:12px;border-radius:8px;background:#f5e7df}
  .ok{background:#eef8ee!important}
  .err{background:#fff0f0!important}
</style>
</head>
<body>
<h1>Repair App Cache</h1>
<p>This page clears this app's service worker and cache so it can reload cleanly.</p>
<p><strong>Your saved churches and language preference will be kept.</strong></p>
<p><em>Direct URL: <code id="directUrl"></code></em></p>
<button class="btn" id="repairBtn" onclick="repair()">Repair this app</button>
<div id="status" hidden></div>
<script>
document.getElementById('directUrl').textContent=new URL('recover.html',location.href).href;
async function repair(){
  const btn=document.getElementById('repairBtn');
  const status=document.getElementById('status');
  btn.disabled=true;
  status.hidden=false;
  status.textContent='Unregistering service worker…';
  try{
    // This same file is deployed to both the production and beta channels, which
    // share one GitHub Pages origin. Never hardcode a channel name here — that is
    // what silently made this page a no-op on production after it was copied over
    // from beta unchanged (channel detection always matched beta, never prod).
    // Instead, read this deployment's OWN sw.js to learn its own CACHE_NAME, and
    // only ever touch this channel's own registration and caches.
    const swSrc=await fetch('sw.js',{cache:'no-store'}).then(r=>r.ok?r.text():null).catch(()=>null);
    const cacheNameMatch=swSrc&&swSrc.match(/CACHE_NAME\s*=\s*'([^']+)'/);
    if(!cacheNameMatch)throw new Error('could not read this app\'s own service worker to identify its cache');
    const ownCacheName=cacheNameMatch[1];
    const isBetaChannel=ownCacheName.startsWith('mmf-beta-');
    const ownScope=new URL('.',location.href).href;

    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      const ownReg=regs.find(r=>r.scope===ownScope);
      if(ownReg)await ownReg.unregister();
    }
    status.textContent='Clearing app cache…';
    if('caches' in window){
      const keys=await caches.keys();
      const toDelete=isBetaChannel
        ?keys.filter(k=>k.startsWith('mmf-beta-'))
        :keys.filter(k=>k.startsWith('mmf-')&&!k.startsWith('mmf-beta-'));
      await Promise.all(toDelete.map(k=>caches.delete(k)));
    }
    // Verify controller released — an old controlling SW may still hold this client briefly
    const stillControlled=navigator.serviceWorker&&navigator.serviceWorker.controller;
    status.className='ok';
    if(stillControlled){
      status.innerHTML='Cache cleared. <strong>To complete the repair:</strong> close this app completely, then reopen it from your Home Screen or browser.';
    }else{
      status.textContent='Done. Opening repaired app…';
      // ?recovered= is explicitly bypassed by the service worker fetch handler
      setTimeout(()=>location.replace('./?recovered='+Date.now()),800);
    }
  }catch(e){
    status.className='err';
    status.textContent='Error: '+e.message+'. Close the app completely and reopen it from your browser, or try again.';
    btn.disabled=false;
  }
}
</script>
</body>
</html>
